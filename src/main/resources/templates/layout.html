<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Travel Expense Claim System</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" id="nav-title" th:href="@{/}">Travel Expense Claim System</a>
    <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
      <li class="nav-item"><a class="nav-link" id="nav-home" th:href="@{/}">Home</a></li>
      <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')"><a class="nav-link" id="nav-new-claim" th:href="@{/claims/new}">New Claim</a></li>
      <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')"><a class="nav-link" id="nav-claims" th:href="@{/claims}">My Claims</a></li>
      <li class="nav-item" sec:authorize="hasRole('REVIEWER')"><a class="nav-link" id="nav-review" th:href="@{/review}">Pending Claims</a></li>
    </ul>
    <form class="d-flex align-items-center" th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
      <span class="navbar-text me-3" id="nav-user" sec:authentication="name">user</span>
      <button type="submit" id="nav-logout" class="btn btn-outline-light btn-sm">Logout</button>
    </form>
  </div>
</nav>
</body>
</html>
