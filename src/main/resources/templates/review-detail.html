<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Review Claim')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container">
  <h1 class="h3 mb-3" id="page-title">Review Claim</h1>
  <div class="alert alert-danger" id="flash-error" th:if="${error}" th:text="${error}"></div>
  <dl class="row card card-body">
    <dt class="col-sm-3">Claim ID</dt><dd class="col-sm-9" id="claim-id" th:text="${claim.id}"></dd>
    <dt class="col-sm-3">Employee</dt><dd class="col-sm-9" th:text="${claim.employeeName}"></dd>
    <dt class="col-sm-3">Destination</dt><dd class="col-sm-9" th:text="${claim.destination}"></dd>
    <dt class="col-sm-3">Purpose</dt><dd class="col-sm-9" th:text="${claim.purpose}"></dd>
    <dt class="col-sm-3">Amount</dt><dd class="col-sm-9" th:text="${claim.amount}"></dd>
    <dt class="col-sm-3">Travel date</dt><dd class="col-sm-9" th:text="${claim.travelDate}"></dd>
    <dt class="col-sm-3">Receipt</dt>
    <dd class="col-sm-9">
      <a id="receipt-link" th:if="${claim.receiptPath != null}" th:href="@{/receipts/{id}(id=${claim.id})}" target="_blank">View receipt</a>
      <span th:if="${claim.receiptPath == null}">No receipt</span>
    </dd>
    <dt class="col-sm-3">Status</dt><dd class="col-sm-9" id="claim-status" th:text="${claim.status}"></dd>
    <dt class="col-sm-3" th:if="${claim.reviewerComment != null}">Reviewer comment</dt>
    <dd class="col-sm-9" id="reviewer-comment" th:if="${claim.reviewerComment != null}" th:text="${claim.reviewerComment}"></dd>
  </dl>

  <form th:if="${claim.status.name() == 'SUBMITTED'}" method="post" th:action="@{/review/{id}/approve(id=${claim.id})}" class="card card-body mb-3">
    <div class="mb-3">
      <label for="comment" class="form-label">Comment (required when rejecting)</label>
      <textarea id="comment" name="comment" rows="3" class="form-control"></textarea>
    </div>
    <div>
      <button type="submit" id="approve-button" class="btn btn-success me-2">Approve</button>
      <button type="submit" id="reject-button" class="btn btn-danger" th:formaction="@{/review/{id}/reject(id=${claim.id})}">Reject</button>
    </div>
  </form>
  <a class="btn btn-secondary" id="back-to-pending" th:href="@{/review}">Back to pending claims</a>
</main>
</body>
</html>
