<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${appName})}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container">
  <div class="card card-body">
    <h1 class="h3" id="app-title" th:text="${appName}">Travel Expense Claim System</h1>
    <p>Submit, review and track travel expense claims.</p>
    <p>Version: <span id="app-version" th:text="${version}">0.0.1</span></p>
    <p>Status: <strong id="app-status">Claim submission available</strong></p>
    <div><a class="btn btn-primary" id="btn-new-claim" th:href="@{/claims/new}">Submit a new claim</a></div>
  </div>
</main>
</body>
</html>
