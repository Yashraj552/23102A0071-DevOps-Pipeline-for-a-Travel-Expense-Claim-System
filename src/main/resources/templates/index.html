<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${appName}">Travel Expense Claim System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    nav { background: #1f3a5f; color: #fff; padding: 14px 24px; }
    nav a { color: #fff; margin-left: 18px; text-decoration: none; }
    main { max-width: 720px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 8px; }
  </style>
</head>
<body>
  <nav>
    <strong id="nav-title">Travel Expense Claims</strong>
    <a href="/" id="nav-home">Home</a>
  </nav>
  <main>
    <h1 id="app-title" th:text="${appName}">Travel Expense Claim System</h1>
    <p>Submit, review and track travel expense claims.</p>
    <p>Version: <span id="app-version" th:text="${version}">0.0.1</span></p>
    <p>Status: <strong id="app-status">Skeleton running</strong></p>
  </main>
</body>
</html>
