<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Pending Claims')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container">
  <h1 class="h3 mb-3" id="page-title">Pending Claims</h1>
  <div class="alert alert-success" id="flash-message" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-danger" id="flash-error" th:if="${error}" th:text="${error}"></div>
  <table class="table table-striped" id="pending-table" th:if="${!claims.isEmpty()}">
    <thead>
      <tr><th>ID</th><th>Employee</th><th>Destination</th><th>Amount</th><th>Travel date</th><th>Submitted</th><th></th></tr>
    </thead>
    <tbody>
      <tr th:each="c : ${claims}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.employeeName}"></td>
        <td th:text="${c.destination}"></td>
        <td th:text="${c.amount}"></td>
        <td th:text="${c.travelDate}"></td>
        <td th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy HH:mm')}"></td>
        <td><a th:id="'review-' + ${c.id}" th:href="@{/review/{id}(id=${c.id})}">Review</a></td>
      </tr>
    </tbody>
  </table>
  <p id="no-pending" th:if="${claims.isEmpty()}">No claims are waiting for review.</p>
</main>
</body>
</html>
