<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('New Claim')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container">
  <h1 class="h3 mb-3" id="page-title">Submit a Travel Expense Claim</h1>
  <form th:action="@{/claims}" th:object="${claimForm}" method="post" class="card card-body">
    <div class="mb-3">
      <label for="employeeName" class="form-label">Employee name</label>
      <input type="text" th:field="*{employeeName}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="destination" class="form-label">Destination</label>
      <input type="text" th:field="*{destination}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="purpose" class="form-label">Purpose of travel</label>
      <input type="text" th:field="*{purpose}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="amount" class="form-label">Amount (INR)</label>
      <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="travelDate" class="form-label">Travel date</label>
      <input type="date" th:field="*{travelDate}" class="form-control" required>
    </div>
    <div><button type="submit" id="submit" class="btn btn-primary">Submit claim</button></div>
  </form>
</main>
</body>
</html>
