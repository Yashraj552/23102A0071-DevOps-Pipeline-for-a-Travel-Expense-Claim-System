<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('New Claim')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container">
  <h1 class="h3 mb-3" id="page-title">Submit a Travel Expense Claim</h1>
  <form th:action="@{/claims}" th:object="${claimForm}" method="post" enctype="multipart/form-data" novalidate class="card card-body">
    <div class="mb-3">
      <label for="destination" class="form-label">Destination</label>
      <input type="text" th:field="*{destination}" class="form-control" th:classappend="${#fields.hasErrors('destination')} ? 'is-invalid'">
      <div class="invalid-feedback" id="destination-error" th:if="${#fields.hasErrors('destination')}" th:errors="*{destination}"></div>
    </div>
    <div class="mb-3">
      <label for="purpose" class="form-label">Purpose of travel</label>
      <input type="text" th:field="*{purpose}" class="form-control" th:classappend="${#fields.hasErrors('purpose')} ? 'is-invalid'">
      <div class="invalid-feedback" id="purpose-error" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></div>
    </div>
    <div class="mb-3">
      <label for="amount" class="form-label">Amount (INR)</label>
      <input type="number" step="0.01" th:field="*{amount}" class="form-control" th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'">
      <div class="invalid-feedback" id="amount-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
    </div>
    <div class="mb-3">
      <label for="travelDate" class="form-label">Travel date</label>
      <input type="date" th:field="*{travelDate}" class="form-control" th:classappend="${#fields.hasErrors('travelDate')} ? 'is-invalid'">
      <div class="invalid-feedback" id="travelDate-error" th:if="${#fields.hasErrors('travelDate')}" th:errors="*{travelDate}"></div>
    </div>
    <div class="mb-3">
      <label for="receipt" class="form-label">Receipt (PDF, JPG or PNG, up to 2 MB)</label>
      <input type="file" id="receipt" name="receipt" accept=".pdf,.jpg,.jpeg,.png" class="form-control" th:classappend="${receiptError} ? 'is-invalid'">
      <div class="invalid-feedback" id="receipt-error" th:if="${receiptError}" th:text="${receiptError}"></div>
    </div>
    <div><button type="submit" id="submit" class="btn btn-primary">Submit claim</button></div>
  </form>
</main>
</body>
</html>
