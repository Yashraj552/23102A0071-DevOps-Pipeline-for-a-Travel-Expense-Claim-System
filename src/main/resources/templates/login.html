<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container" style="max-width: 460px;">
  <h1 class="h3 mb-3" id="page-title">Log in</h1>
  <div class="alert alert-danger" id="login-error" th:if="${param.error}">Invalid username or password</div>
  <div class="alert alert-info" id="logout-message" th:if="${param.logout}">You have been logged out</div>
  <form th:action="@{/login}" method="post" class="card card-body">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" id="username" name="username" class="form-control" autofocus>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" name="password" class="form-control">
    </div>
    <button type="submit" id="login-button" class="btn btn-primary">Log in</button>
  </form>
</main>
</body>
</html>
